# Build, test, publish a container image, and deploy it to Azure App Service.

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: helloworld
  dockerRegistryServiceConnection: 'YOUR-ACR-SERVICE-CONNECTION'
  azureSubscription: 'YOUR-AZURE-SERVICE-CONNECTION'
  containerRegistry: 'YOUR-REGISTRY.azurecr.io'
  webAppName: 'YOUR-WEB-APP-NAME'

steps:
- task: Maven@3
  displayName: Test and package
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'

- task: Docker@2
  displayName: Build and push container image
  inputs:
    command: buildAndPush
    containerRegistry: '$(dockerRegistryServiceConnection)'
    repository: '$(imageRepository)'
    dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)'
    tags: |
      $(Build.BuildId)
      latest

- task: AzureWebAppContainer@1
  displayName: Deploy to Azure App Service
  inputs:
    azureSubscription: '$(azureSubscription)'
    appName: '$(webAppName)'
    containers: '$(containerRegistry)/$(imageRepository):$(Build.BuildId)'
    appSettings: '-WEBSITES_PORT 8080'
